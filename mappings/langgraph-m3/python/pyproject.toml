[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "boundrelay-m3-langgraph"
version = "0.0.0"
requires-python = ">=3.14"
# Runtime dependencies are intentionally empty: langgraph is pinned in
# requirements-dev.txt (mapping-local venv space, installed at setup only),
# never at run time (offline deterministic nodes, no network).
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
