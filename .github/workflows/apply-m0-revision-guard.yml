name: Apply M0 revision guard

on:
  push:
    branches: [automation/m0-lockfile]
    paths:
      - ".github/workflows/apply-m0-revision-guard.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v7
        with:
          ref: feat/m0-behavioral-parity

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: lessons/00-workflow-or-agent/typescript/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e lessons/00-workflow-or-agent/python
          npm ci --prefix lessons/00-workflow-or-agent/typescript

      - name: Apply revision-bound publish guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cbfc8a97db5d188ffe330c08038458ba6a94da10"
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/parity/verify_m0.py")
          content = path.read_text(encoding="utf-8")

          old_start = (
              "def verify() -> dict[str, object]:\n"
              "    assert_clean_worktree()\n"
              "    shutil.rmtree(OUTPUT_ROOT, ignore_errors=True)\n"
          )
          new_start = (
              "def verify() -> dict[str, object]:\n"
              "    assert_clean_worktree()\n"
              "    verified_revision = _revision()\n"
              "    shutil.rmtree(OUTPUT_ROOT, ignore_errors=True)\n"
          )
          if content.count(old_start) != 1:
              raise SystemExit(f"Expected one verify start block, found {content.count(old_start)}")
          content = content.replace(old_start, new_start, 1)

          evidence_marker = "    evidence: dict[str, object] = {\n"
          revision_marker = '        "revision": _revision(),\n'
          evidence_index = content.find(evidence_marker)
          if evidence_index < 0:
              raise SystemExit("PASSED evidence marker not found")
          prefix = content[:evidence_index]
          suffix = content[evidence_index:]
          if revision_marker not in suffix:
              raise SystemExit("PASSED evidence revision field not found")

          guard = (
              "    assert_clean_worktree()\n"
              "    current_revision = _revision()\n"
              "    if current_revision != verified_revision:\n"
              "        raise RuntimeError(\n"
              "            \"Git revision changed during M0 verification: \"\n"
              "            f\"started {verified_revision}, ended {current_revision}\"\n"
              "        )\n\n"
          )
          suffix = suffix.replace(
              revision_marker,
              '        "revision": verified_revision,\n',
              1,
          )
          content = prefix + guard + suffix
          path.write_text(content, encoding="utf-8")
          PY
          python -m py_compile tools/parity/verify_m0.py
          git diff --check

      - name: Run focused GREEN tests
        run: |
          python -m unittest \
            tools.parity.test_normalize \
            tools.parity.test_verification_safety \
            -v

      - name: Commit candidate locally
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/parity/verify_m0.py
          git commit -m "fix(verification): lock revision through evidence publish"

      - name: Run full exact-head gate before push
        run: python scripts/verify_m0.py

      - name: Push verified candidate
        run: git push origin HEAD:feat/m0-behavioral-parity
