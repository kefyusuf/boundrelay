name: Generate M0 lockfile

on:
  push:
    branches: [automation/m0-lockfile]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --prefix lessons/00-workflow-or-agent/typescript
      - uses: actions/upload-artifact@v7
        with:
          name: m0-package-lock
          path: lessons/00-workflow-or-agent/typescript/package-lock.json
          if-no-files-found: error
          retention-days: 1
