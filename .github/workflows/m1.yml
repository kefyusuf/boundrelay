name: M1 Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            lessons/00-workflow-or-agent/typescript/package-lock.json
            lessons/01-bounded-tool-loop/typescript/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            lessons/00-workflow-or-agent/python/pyproject.toml
            lessons/01-bounded-tool-loop/python/pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e lessons/00-workflow-or-agent/python
          python -m pip install -e lessons/01-bounded-tool-loop/python
      - run: |
          npm ci --prefix lessons/00-workflow-or-agent/typescript
          npm ci --prefix lessons/01-bounded-tool-loop/typescript
      - run: python scripts/verify_m1.py
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m1-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: .boundrelay/m1/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
