name: Finalize M0 review status

on:
  push:
    branches: [automation/m0-lockfile]
    paths:
      - ".github/workflows/finalize-m0-review-20260902.yml"

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: "4"
    steps:
      - name: Evaluate current review and exact-head evidence
        id: evaluate
        run: |
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          output = Path("finalization")
          output.mkdir()

          def request(path: str, *, method: str = "GET", payload: object | None = None):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  api + path,
                  data=body,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "boundrelay-m0-finalizer",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
              return json.loads(raw) if raw else None

          def iso(value: str) -> dt.datetime:
              return dt.datetime.fromisoformat(value.replace("Z", "+00:00"))

          def codex_user(login: str | None) -> bool:
              value = (login or "").lower()
              return "codex" in value or value == "chatgpt-codex-connector"

          pr = request(f"/repos/{repo}/pulls/{pr_number}")
          head_sha = pr["head"]["sha"]
          head_ref = pr["head"]["ref"]
          issue_comments = request(f"/repos/{repo}/issues/{pr_number}/comments?per_page=100")
          review_request = next(
              (
                  item for item in reversed(issue_comments)
                  if "@codex review" in (item.get("body") or "").lower()
              ),
              None,
          )
          if review_request is None:
              raise RuntimeError("No Codex re-review request comment was found.")

          request_time = iso(review_request["created_at"])
          commit = request(f"/repos/{repo}/commits/{head_sha}")
          commit_time = iso(commit["commit"]["committer"]["date"])
          if commit_time > request_time:
              raise RuntimeError(
                  f"Codex re-review request is stale: head {head_sha} was committed after the request."
              )

          review_signal = None
          new_inline = []
          reviews_after = []
          reactions_after = []
          for _ in range(20):
              reviews = request(f"/repos/{repo}/pulls/{pr_number}/reviews?per_page=100")
              inline = request(f"/repos/{repo}/pulls/{pr_number}/comments?per_page=100")
              reactions = request(
                  f"/repos/{repo}/issues/comments/{review_request['id']}/reactions?per_page=100"
              )

              reviews_after = [
                  item for item in reviews
                  if codex_user(item.get("user", {}).get("login"))
                  and item.get("submitted_at")
                  and iso(item["submitted_at"]) >= request_time
                  and item.get("commit_id") == head_sha
              ]
              new_inline = [
                  item for item in inline
                  if codex_user(item.get("user", {}).get("login"))
                  and item.get("created_at")
                  and iso(item["created_at"]) >= request_time
                  and (item.get("commit_id") == head_sha or item.get("original_commit_id") == head_sha)
              ]
              reactions_after = [
                  item for item in reactions
                  if codex_user(item.get("user", {}).get("login"))
                  and item.get("content") == "+1"
              ]
              if new_inline:
                  review_signal = "findings"
                  break
              if reviews_after or reactions_after:
                  review_signal = "clean"
                  break
              time.sleep(15)

          runs = request(
              f"/repos/{repo}/actions/runs?event=pull_request&branch="
              + urllib.parse.quote(head_ref, safe="")
              + "&per_page=100"
          )["workflow_runs"]
          m0_runs = [
              item for item in runs
              if item.get("name") == "M0 Verification"
              and item.get("head_sha") == head_sha
              and item.get("status") == "completed"
              and item.get("conclusion") == "success"
          ]
          if not m0_runs:
              raise RuntimeError(f"No successful exact-head M0 workflow exists for {head_sha}.")
          m0_run = max(m0_runs, key=lambda item: item["created_at"])
          artifacts = request(
              f"/repos/{repo}/actions/runs/{m0_run['id']}/artifacts?per_page=100"
          )["artifacts"]
          artifact_name = f"m0-verification-{head_sha}"
          artifact = next(
              (item for item in artifacts if item.get("name") == artifact_name and not item.get("expired")),
              None,
          )
          if artifact is None:
              raise RuntimeError(f"Exact-head artifact {artifact_name} was not found.")

          unresolved_current_inline = [
              {
                  "id": item["id"],
                  "path": item["path"],
                  "line": item.get("line"),
                  "body": item.get("body", ""),
                  "created_at": item["created_at"],
              }
              for item in new_inline
          ]
          status = "CLEAN" if review_signal == "clean" and not new_inline else (
              "FINDINGS" if new_inline else "PENDING"
          )
          report = {
              "status": status,
              "repository": repo,
              "pull_request": int(pr_number),
              "head_sha": head_sha,
              "review_request_comment_id": review_request["id"],
              "review_request_created_at": review_request["created_at"],
              "codex_reviews_after_request": len(reviews_after),
              "codex_clean_reactions": len(reactions_after),
              "new_inline_findings": unresolved_current_inline,
              "m0_workflow_run_id": m0_run["id"],
              "m0_artifact_id": artifact["id"],
              "m0_artifact_name": artifact["name"],
              "m0_artifact_digest": artifact.get("digest"),
              "evaluated_at": dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          (output / "review-finalization.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )

          description = {
              "CLEAN": "Codex re-review clean; exact-head M0 evidence verified",
              "FINDINGS": f"Codex re-review produced {len(new_inline)} inline finding(s)",
              "PENDING": "Codex re-review has not produced a completion signal",
          }[status]
          request(
              f"/repos/{repo}/statuses/{head_sha}",
              method="POST",
              payload={
                  "state": "success" if status == "CLEAN" else ("failure" if status == "FINDINGS" else "pending"),
                  "context": "M0 Final Review",
                  "description": description[:140],
                  "target_url": m0_run["html_url"],
              },
          )

          lines = [
              "## M0 final review gate",
              "",
              f"- **Status:** `{status}`",
              f"- **Exact PR head:** `{head_sha}`",
              f"- **M0 workflow run:** `{m0_run['id']}`",
              f"- **Evidence artifact:** `{artifact['name']}`",
              f"- **Artifact digest:** `{artifact.get('digest')}`",
              f"- **Codex reviews after request:** `{len(reviews_after)}`",
              f"- **Codex clean reactions:** `{len(reactions_after)}`",
              f"- **New inline findings:** `{len(new_inline)}`",
          ]
          if new_inline:
              lines.extend(["", "### Current-head findings"])
              for item in unresolved_current_inline:
                  lines.append(
                      f"- `{item['path']}` line `{item['line']}` — "
                      + " ".join(item["body"].split())[:500]
                  )
          lines.extend([
              "",
              "`main` was not modified and this gate does not merge the pull request.",
          ])
          request(
              f"/repos/{repo}/issues/{pr_number}/comments",
              method="POST",
              payload={"body": "\n".join(lines)},
          )

          print(json.dumps(report, indent=2))
          if status != "CLEAN":
              raise SystemExit(1)
          PY

      - name: Upload final review report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m0-final-review-report
          path: finalization/
          if-no-files-found: error
          retention-days: 3
