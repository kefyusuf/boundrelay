name: Apply final M0 verifier fix

on:
  push:
    branches: [automation/m0-lockfile]
    paths:
      - ".github/workflows/apply-m0-final-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/m0-behavioral-parity

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install verification dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e lessons/00-workflow-or-agent/python

      - name: Reuse one execution identity in failure evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/parity/verify_m0.py")
          content = path.read_text(encoding="utf-8")
          marker = "        failed = {\n"
          old_revision = '            "revision": _revision(),\n'
          old_identity = '            "execution_identity": _execution_identity(),\n'

          if content.count(marker) != 1:
              raise SystemExit(f"Expected one failure evidence mapping, found {content.count(marker)}")
          if content.count(old_revision) != 1:
              raise SystemExit(f"Expected one independent failure revision call, found {content.count(old_revision)}")
          if content.count(old_identity) != 1:
              raise SystemExit(f"Expected one independent failure identity call, found {content.count(old_identity)}")

          content = content.replace(
              marker,
              "        execution_identity = _execution_identity()\n        failed = {\n",
              1,
          )
          content = content.replace(
              old_revision,
              '            "revision": execution_identity["revision"],\n',
              1,
          )
          content = content.replace(
              old_identity,
              '            "execution_identity": execution_identity,\n',
              1,
          )
          path.write_text(content, encoding="utf-8")
          PY

          python -m py_compile tools/parity/verify_m0.py
          python -m unittest \
            tools.parity.test_verification_safety.VerificationSafetyTests.test_failure_evidence_uses_consistent_execution_identity \
            -v
          git diff --check

      - name: Commit and push fast-forward only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/parity/verify_m0.py
          git commit -m "fix(verification): reuse failure execution identity"
          git push origin HEAD:feat/m0-behavioral-parity
