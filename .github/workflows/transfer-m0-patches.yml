name: Transfer M0 task patches

on:
  push:
    branches: [automation/m0-lockfile]
    paths:
      - ".automation/m0-patches/**"
      - ".github/workflows/transfer-m0-patches.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staged patches
        uses: actions/checkout@v7
        with:
          path: source

      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/m0-behavioral-parity
          path: target

      - name: Verify staged chunks
        run: |
          set -euo pipefail
          cd source
          cat <<'CHECKSUMS' | sha256sum --check
          6d086bc993a06225afc4dc4c74cab165864f431ce73d075e7794c2d62a64eb16  .automation/m0-patches/part-00a
          a72735c1ccdfca3641acb7f747e5cd67b278cb172049a2a1c9112bb69f67ca33  .automation/m0-patches/part-00b
          30a178c018a2a53f873131264b9c3af786fe5605eb6e1d8922ca3e6c391e3d78  .automation/m0-patches/part-01
          bc9b00770d251fb2afc2812541db0fd2ebf5dea106b1fec3b95d5aa363bc03e3  .automation/m0-patches/part-02
          7793f11b1152617dbddf88aa6280127cef24b5dfdcc355a195a6ad75031a2c69  .automation/m0-patches/part-03
          05cb2dee98f1d42512008bed3379d164e0072df3c510cb315822fc8a0bb3ea58  .automation/m0-patches/part-04
          f9a57ba9ea908a9ff575a556cd66ebb9643a5139657780d6cdc7056e782d17b5  .automation/m0-patches/part-05
          CHECKSUMS

      - name: Reconstruct and verify patch bundle
        run: |
          set -euo pipefail
          cat \
            source/.automation/m0-patches/part-00a \
            source/.automation/m0-patches/part-00b \
            source/.automation/m0-patches/part-01 \
            source/.automation/m0-patches/part-02 \
            source/.automation/m0-patches/part-03 \
            source/.automation/m0-patches/part-04 \
            source/.automation/m0-patches/part-05 \
            > /tmp/tasks3-5.patch.gz.b64
          printf '%s  %s\n' \
            '900b5e1d6a3dc26b456b6cad56f3faba97133f33bb7b97cf4b9ff9f596702a57' \
            /tmp/tasks3-5.patch.gz.b64 \
            | sha256sum --check
          base64 --decode /tmp/tasks3-5.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/tasks3-5.patch
          printf '%s  %s\n' \
            '0282524d6bd315c6ae1eb39994e145f173599bee6442d426e0f7402e6b007d16' \
            /tmp/tasks3-5.patch \
            | sha256sum --check

      - name: Apply task commits to feature branch
        run: |
          set -euo pipefail
          cd target
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git am /tmp/tasks3-5.patch
          git push origin HEAD:feat/m0-behavioral-parity
